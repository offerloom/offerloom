<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description">
  <title id="title">OfferLoom — Every Deal. One Destination.</title>
  <desc id="description">Discover product picks across tech, fashion and home. Compare product details at a glance, then shop directly with the merchant.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f8ff"/>
      <stop offset="0.62" stop-color="#fffaf7"/>
      <stop offset="1" stop-color="#f2f3ff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f6f7ff"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b4cff"/>
      <stop offset="1" stop-color="#784cff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#26234f" flood-opacity=".13"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1c2140" flood-opacity=".12"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#5b4cff" opacity=".15"/>
    </pattern>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="1030" cy="174" r="190" fill="#ffe3d9" opacity=".72"/>
  <circle cx="73" cy="690" r="130" fill="#e7e4ff" opacity=".72"/>
  <path d="M-80 610 C155 470 272 770 488 637 S813 454 1160 625" fill="none" stroke="#5b4cff" stroke-width="3" opacity=".11"/>
  <path d="M-60 632 C169 492 278 790 502 659 S823 478 1140 650" fill="none" stroke="#ff5a36" stroke-width="2" opacity=".13"/>

  <g font-family="Inter, Avenir Next, Arial, sans-serif">
    <!-- Brand mark and wordmark -->
    <g transform="translate(72 64)">
      <rect x="0" y="4" width="27" height="27" rx="8" fill="#1687ea"/>
      <rect x="34" y="4" width="27" height="27" rx="8" fill="#62c6ff"/>
      <rect x="0" y="38" width="27" height="27" rx="8" fill="#0877d6"/>
      <rect x="34" y="38" width="27" height="27" rx="8" fill="#2ba9f0"/>
      <text x="82" y="52" font-size="47" font-weight="800" letter-spacing="-2.2" fill="#111827">Offer</text>
      <text x="207" y="52" font-size="47" font-weight="800" letter-spacing="-2.2" fill="#5b4cff">Loom</text>
    </g>

    <rect x="72" y="165" width="313" height="46" rx="23" fill="#eeecff"/>
    <circle cx="98" cy="188" r="6" fill="#ff5a36"/>
    <text x="116" y="196" font-size="17" font-weight="750" letter-spacing="2.2" fill="#5347d9">SMARTER PRODUCT DISCOVERY</text>

    <text x="70" y="291" font-size="70" font-weight="800" letter-spacing="-3.8" fill="#111827">Every Deal.</text>
    <text x="70" y="371" font-size="70" font-weight="800" letter-spacing="-3.8" fill="#5b4cff">One Destination.</text>
    <text x="74" y="426" font-size="25" font-weight="500" fill="#5f6577">Discover product picks across the things you love.</text>

    <!-- Category chips -->
    <g font-size="18" font-weight="700">
      <rect x="72" y="463" width="173" height="49" rx="24.5" fill="#fff" stroke="#e5e3f8" stroke-width="2"/>
      <text x="158" y="494" text-anchor="middle" fill="#282d3d">⌁  TECH</text>
      <rect x="257" y="463" width="177" height="49" rx="24.5" fill="#fff" stroke="#e5e3f8" stroke-width="2"/>
      <text x="345" y="494" text-anchor="middle" fill="#282d3d">✦  FASHION</text>
      <rect x="446" y="463" width="151" height="49" rx="24.5" fill="#fff" stroke="#e5e3f8" stroke-width="2"/>
      <text x="521" y="494" text-anchor="middle" fill="#282d3d">⌂  HOME</text>
    </g>

    <!-- Phone illustration -->
    <g filter="url(#shadow)">
      <rect x="334" y="548" width="412" height="566" rx="46" fill="#171a2d"/>
      <rect x="348" y="562" width="384" height="538" rx="34" fill="url(#screen)"/>
      <rect x="474" y="573" width="132" height="17" rx="8.5" fill="#171a2d"/>
      <text x="374" y="632" font-size="20" font-weight="800" fill="#111827">Good finds, all in one place.</text>
      <text x="374" y="662" font-size="14" fill="#767d91">Browse picks. Compare. Choose.</text>
      <rect x="374" y="685" width="332" height="47" rx="15" fill="#fff" stroke="#e8e8f0"/>
      <circle cx="396" cy="708" r="7" fill="none" stroke="#8c91a2" stroke-width="2.5"/>
      <path d="m401 713 6 6" stroke="#8c91a2" stroke-width="2.5" stroke-linecap="round"/>
      <text x="419" y="714" font-size="14" fill="#989dad">Search phones, style, home…</text>

      <text x="375" y="770" font-size="15" font-weight="800" fill="#171a2d">Popular product picks</text>
      <text x="705" y="770" font-size="12" text-anchor="end" font-weight="700" fill="#5b4cff">VIEW ALL →</text>

      <!-- headphones product card -->
      <rect x="374" y="788" width="155" height="206" rx="19" fill="#fff" stroke="#e9eaf2"/>
      <rect x="388" y="802" width="127" height="100" rx="14" fill="#f0edff"/>
      <circle cx="451" cy="849" r="29" fill="#d7d2ff"/>
      <path d="M431 855v-10a20 20 0 0 1 40 0v10m-40 0v15a7 7 0 0 0 14 0v-11h-8m34-4v15a7 7 0 0 1-14 0v-11h8" fill="none" stroke="#39318c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="389" y="928" font-size="13" font-weight="700" fill="#5b4cff">TECH</text>
      <text x="389" y="950" font-size="14" font-weight="750" fill="#252a39">Audio picks</text>
      <text x="389" y="974" font-size="11" fill="#808698">Check current price</text>

      <!-- fashion product card -->
      <rect x="545" y="788" width="161" height="206" rx="19" fill="#fff" stroke="#e9eaf2"/>
      <rect x="559" y="802" width="133" height="100" rx="14" fill="#fff0e9"/>
      <path d="M607 829c0-8 6-14 14-14s14 6 14 14v5h10l13 49h-74l13-49h10z" fill="#ff8c68"/>
      <path d="M616 832c0 10 10 10 10 0" fill="none" stroke="#fff4ef" stroke-width="3"/>
      <text x="560" y="928" font-size="13" font-weight="700" fill="#e65a36">FASHION</text>
      <text x="560" y="950" font-size="14" font-weight="750" fill="#252a39">Style finds</text>
      <text x="560" y="974" font-size="11" fill="#808698">Compare details</text>

      <!-- home product card -->
      <rect x="374" y="1008" width="332" height="69" rx="17" fill="#fff" stroke="#e9eaf2"/>
      <rect x="387" y="1019" width="49" height="47" rx="13" fill="#e6f6ee"/>
      <path d="M403 1057v-16l9-9 9 9v16m-13 0v-9h8v9" fill="none" stroke="#16875b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="451" y="1040" font-size="13" font-weight="700" fill="#16875b">HOME</text>
      <text x="451" y="1060" font-size="15" font-weight="750" fill="#252a39">Everyday home picks</text>
      <path d="m678 1037 8 8-8 8" fill="none" stroke="#5b4cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- floating comparison card -->
    <g filter="url(#smallShadow)" transform="rotate(-4 254 803)">
      <rect x="62" y="741" width="250" height="132" rx="22" fill="#fff"/>
      <circle cx="96" cy="779" r="17" fill="#e7f7ee"/>
      <path d="m88 779 6 6 11-13" fill="none" stroke="#16875b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="124" y="777" font-size="15" font-weight="800" fill="#182033">Compare details</text>
      <text x="84" y="819" font-size="13" fill="#72798c">See key product info</text>
      <text x="84" y="842" font-size="13" fill="#72798c">before you shop.</text>
    </g>

    <!-- floating merchant checkout card -->
    <g filter="url(#smallShadow)" transform="rotate(3 824 915)">
      <rect x="768" y="856" width="250" height="126" rx="22" fill="#fff"/>
      <circle cx="804" cy="894" r="17" fill="#fff0e9"/>
      <path d="M797 889h14l-2 12h-10l-2-12zm2-3h10m-8 19h.1m7 0h.1" fill="none" stroke="#ed6845" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="824" y="894" font-size="14" font-weight="800" fill="#182033">Shop with the merchant</text>
      <text x="790" y="935" font-size="13" fill="#72798c">Choose where checkout</text>
      <text x="790" y="957" font-size="13" fill="#72798c">happens.</text>
    </g>

    <!-- value proposition and CTA -->
    <text x="540" y="1172" text-anchor="middle" font-size="25" font-weight="800" fill="#171a2d">A clearer way to find your next great pick.</text>
    <text x="540" y="1210" text-anchor="middle" font-size="18" fill="#62697c">Discover · Compare · Shop directly with the merchant</text>
    <rect x="233" y="1243" width="614" height="74" rx="25" fill="url(#cta)"/>
    <text x="540" y="1289" text-anchor="middle" font-size="21" font-weight="800" fill="#fff">Explore offerloom.offerloom.workers.dev</text>
    <text x="540" y="1337" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1" fill="#777d90">OFFERLOOM MAY EARN FROM ELIGIBLE PURCHASES · NO EXTRA COST TO YOU</text>
  </g>
</svg>
