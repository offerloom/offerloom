name = "offerloom"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]
main = "dist/server/index.js"
workers_dev = true

[assets]
directory = "dist/client"
binding = "ASSETS"

[vars]
DEPLOYMENT_PLATFORM = "workers"

[[d1_databases]]
binding = "DB"
database_name = "offerloom"
database_id = "82b0bcbe-93ac-4011-a400-52bfe6759ac1"
migrations_dir = "drizzle"

[observability]
enabled = true

[triggers]
# Auto-post daily at 7:00 AM and 5:00 PM IST; drain queued posts at 9:30 AM IST.
# Cloudflare cron expressions are UTC: 07:00 IST = 01:30 UTC, 17:00 IST = 11:30 UTC, 09:30 IST = 04:00 UTC.
crons = ["30 1 * * *", "30 11 * * *", "0 4 * * *"]
