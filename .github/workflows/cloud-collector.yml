name: Daily cloud product collection
run-name: "Cloud catalogue · ${{ (github.event_name == 'push' || inputs.probe) && 'probe' || inputs.window || (github.event.schedule == '30 12 * * *' && 'evening' || 'morning') }}"

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 IST morning backup.
    - cron: "30 12 * * *" # 18:00 IST evening backup.
  workflow_dispatch:
    inputs:
      probe:
        description: "Test browser access without publishing"
        type: boolean
        default: true
      force:
        description: "Publish again even if a run completed today"
        type: boolean
        default: false
      window:
        description: "Collection window to publish"
        type: choice
        options: [morning, evening]
        default: morning
  push:
    branches: [codex/cloud-browser-collector, codex/fix-daily-collector, codex/twice-daily-product-shelves]
    paths:
      - scripts/cloud-browser-collector.mjs
      - .github/workflows/cloud-collector.yml

permissions:
  contents: read
concurrency:
  group: offerloom-cloud-collector
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'push' || inputs.probe || vars.CLOUD_COLLECTOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Offline collector tests
        run: node --test tests/browser-collector.test.mjs tests/cloud-browser-collector.test.mjs tests/collector-scheduler.test.mjs
      - name: Cloud browser probe (no publication)
        if: github.event_name == 'push' || inputs.probe
        run: node scripts/cloud-browser-collector.mjs --probe
      - name: Discover, refresh and publish
        if: github.event_name != 'push' && !inputs.probe
        run: node scripts/cloud-browser-collector.mjs ${{ inputs.force && '--force' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COLLECTION_WINDOW: ${{ inputs.window || (github.event.schedule == '30 12 * * *' && 'evening' || 'morning') }}
      - name: Run summary
        if: always()
        shell: bash
        run: |
          if test -f outputs/cloud-collector/summary.json; then
            cat outputs/cloud-collector/summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Collection did not complete; see the failed step. No successful publication is claimed.' >> "$GITHUB_STEP_SUMMARY"
          fi

  flipkart:
    if: github.event_name == 'push' || inputs.probe || vars.CLOUD_COLLECTOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Flipkart discovery, refresh and publish
        if: github.event_name != 'push' && !inputs.probe
        run: node scripts/flipkart-collector.mjs ${{ inputs.force && '--force' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COLLECTION_WINDOW: ${{ inputs.window || (github.event.schedule == '30 12 * * *' && 'evening' || 'morning') }}
      - name: Flipkart browser probe (no publication)
        if: github.event_name == 'push' || inputs.probe
        run: node scripts/flipkart-collector.mjs --probe

  flipkart-match:
    # Looks up ~50 Amazon products on Flipkart per run (≈100/day) and attaches strict matches for price comparison.
    if: github.event_name != 'push' && !inputs.probe && vars.CLOUD_COLLECTOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Match Amazon products on Flipkart and publish
        run: node scripts/flipkart-collector.mjs --match-only ${{ inputs.force && '--force' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COLLECTION_WINDOW: ${{ inputs.window || (github.event.schedule == '30 12 * * *' && 'evening' || 'morning') }}

  amazon-refresh:
    # Second Amazon price refresh (products after the main job's first 100), so every product is re-checked daily.
    if: github.event_name != 'push' && !inputs.probe && vars.CLOUD_COLLECTOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Refresh remaining Amazon prices and publish
        run: node scripts/cloud-browser-collector.mjs --refresh-only ${{ inputs.force && '--force' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COLLECTION_WINDOW: ${{ inputs.window || (github.event.schedule == '30 12 * * *' && 'evening' || 'morning') }}
