name: Daily cloud product collection

on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST; GitHub may delay scheduled runs.
  workflow_dispatch:
    inputs:
      probe:
        description: "Test browser access without publishing"
        type: boolean
        default: true
  push:
    branches: [codex/cloud-browser-collector]
    paths:
      - scripts/cloud-browser-collector.mjs
      - .github/workflows/cloud-collector.yml

permissions:
  contents: read
concurrency:
  group: offerloom-cloud-collector
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'push' || inputs.probe || vars.CLOUD_COLLECTOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Offline collector tests
        run: node --test tests/browser-collector.test.mjs tests/cloud-browser-collector.test.mjs
      - name: Cloud browser probe (no publication)
        if: github.event_name == 'push' || inputs.probe
        run: node scripts/cloud-browser-collector.mjs --probe
      - name: Discover, refresh and publish
        if: github.event_name != 'push' && !inputs.probe
        run: node scripts/cloud-browser-collector.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Run summary
        if: always()
        shell: bash
        run: |
          if test -f outputs/cloud-collector/summary.json; then
            cat outputs/cloud-collector/summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Collection did not complete; see the failed step. No successful publication is claimed.' >> "$GITHUB_STEP_SUMMARY"
          fi
