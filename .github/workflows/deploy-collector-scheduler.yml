name: Deploy cloud collector scheduler
on:
  push:
    branches: [main]
    paths:
      - worker/collector-scheduler/**
      - .github/workflows/deploy-collector-scheduler.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offerloom-collector-scheduler-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --test tests/collector-scheduler.test.mjs
      - run: npx wrangler deploy --config worker/collector-scheduler/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
