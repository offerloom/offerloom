name: TEMP send AJIO follow-up
on:
  push:
    branches: [claude/send-ajio-followup]
    paths: [scripts/send_ajio_followup.py]
permissions: { contents: read }
concurrency: { group: send-ajio-followup, cancel-in-progress: false }
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/send_ajio_followup.py
        env:
          AJIO_MAIL_FETCH: ${{ secrets.AJIO_MAIL_FETCH }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
