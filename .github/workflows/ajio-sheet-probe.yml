name: TEMP AJIO sheet probe
on:
  push:
    branches: [claude/ajio-sheet-probe]
    paths: [scripts/ajio_sheet_probe.py]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ajio_sheet_probe.py
        env:
          AJIO_MAIL_FETCH: ${{ secrets.AJIO_MAIL_FETCH }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
