name: TEMP Flipkart preview
on:
  push:
    branches: [claude/flipkart-collector]
    paths: [.github/workflows/flipkart-preview.yml]
permissions: { contents: read }
concurrency: { group: flipkart-preview, cancel-in-progress: false }
jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Apply D1 migrations (adds the Flipkart merchant row)
        run: npx wrangler d1 migrations apply offerloom --remote
      - name: First Flipkart collection
        run: node scripts/flipkart-collector.mjs --force
        env: { COLLECTION_WINDOW: evening }
      - run: npm run build
      - name: Upload preview version (does not change the live site)
        run: |
          out=$(npx wrangler versions upload --config wrangler.toml --preview-alias flipkart 2>&1); echo "$out" | tail -20
          url=$(echo "$out" | grep -oE 'https://[a-z0-9.-]+workers\.dev' | grep -i flipkart | head -1)
          [ -z "$url" ] && url=$(echo "$out" | grep -oE 'https://[a-z0-9.-]+workers\.dev' | head -1)
          echo "::notice title=Preview URL::$url"
