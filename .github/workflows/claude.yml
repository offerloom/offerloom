name: Claude

# Lets the owner (or the collector's failure reports) ask Claude to make a change by mentioning
# @claude in an issue or pull request. Claude works on a branch and opens a pull request; it never
# merges. Only users with write access can trigger it (enforced by the action itself).
#
# One-time setup (repo admin): install the Claude GitHub App (https://github.com/apps/claude) and add
# ONE repository secret: ANTHROPIC_API_KEY, or CLAUDE_CODE_OAUTH_TOKEN (then swap the input below).
# Issue/comment triggers only run from the default branch, so this file must be on main.

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Cap the work per run. CLAUDE.md ("Automated maintenance rules") sets what Claude may change.
          claude_args: |
            --max-turns 30
