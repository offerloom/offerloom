name: TEMP send AJIO feed request
on:
  push:
    branches: [claude/send-ajio-feed-request]
permissions: { contents: read }
concurrency: { group: send-ajio-feed-request, cancel-in-progress: false }
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/send_ajio_feed_request.py
        env:
          AJIO_MAIL_FETCH: ${{ secrets.AJIO_MAIL_FETCH }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
