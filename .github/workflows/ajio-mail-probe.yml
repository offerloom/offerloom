name: TEMP AJIO mail probe
on:
  push:
    branches: [claude/ajio-mail-offers]
    paths: [scripts/ajio_mail_probe.py, .github/workflows/ajio-mail-probe.yml]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ajio_mail_probe.py
        env:
          AJIO_MAIL_FETCH: ${{ secrets.AJIO_MAIL_FETCH }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
