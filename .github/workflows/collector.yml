name: Sync product deals

on:
  # Schedule disabled 2026-09-15: Amazon's bot-mitigation blocks/challenges GitHub Actions'
  # shared runner IPs almost entirely (22-24 of 25 URLs failed on #productTitle never
  # rendering, even after raising timeouts) — a residential/business IP doesn't hit this.
  # Collection now runs from the owner's Mac via a LaunchAgent instead (see
  # scripts/install-collector-schedule.mjs). workflow_dispatch is kept for manual runs
  # only (e.g. to re-test whether GitHub's IP range is still blocked).
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GitHub only runs schedule/workflow_dispatch triggers from the default branch,
          # but the current app code and collector config live on "offerloom" (the dev
          # branch) — pin the checkout there so scheduled runs use current code, not main.
          ref: offerloom

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run collector
        run: node scripts/browser-collector.mjs scripts/collector-config.json --d1-remote --auto-approve
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Send sync summary email
        if: always()
        run: node scripts/send-sync-email.mjs
        env:
          GMAIL_USER: contact.offerloom@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Upload collector logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-logs
          path: outputs/collector/
          retention-days: 7
