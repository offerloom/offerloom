name: Sync product deals

on:
  schedule:
    # Every 3 hours. Kept off :00/:30 to avoid piling onto GitHub's busiest minutes,
    # and spaced to stay comfortably inside the free 2,000 min/month Actions budget
    # for a private repo (~5-6 min per run × 8 runs/day × 30 days ≈ 1,200-1,440 min/month).
    - cron: "7 */3 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run collector
        run: node scripts/browser-collector.mjs scripts/collector-config.json --d1-remote --auto-approve
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload collector logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-logs
          path: outputs/collector/
          retention-days: 7
